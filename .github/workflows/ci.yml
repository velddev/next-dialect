name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Compiler unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Example app (build + HTTP + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The e2e layer runs Chromium only (playwright.config.mjs declares no
      # projects), so there is no reason to download three browsers.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds both flows, then runs the 22 HTTP/artifact assertions and the
      # 26 Playwright UX tests against the live servers.
      - run: npm run test:example

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/app/playwright-report/
            examples/app/test-results/
          retention-days: 7

  website:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run website:build
