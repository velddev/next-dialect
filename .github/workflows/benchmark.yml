name: Benchmark

# Measures what a visitor downloads, on this PR and on its base, and fails if
# it grew. Only `baseline` and `next-dialect` are built: a change in this
# repository cannot move next-intl or Paraglide, so building them would triple
# the runtime to compare two numbers against themselves. The full field is what
# benchmarks/README.md is for, run by hand.
#
# Both sides are measured on the same runner in the same job. Comparing against
# the committed results-*x.json instead would be cheaper and wrong — those were
# recorded on different hardware with a different Next version.
on:
  pull_request:
    paths:
      - 'packages/next-dialect/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      scales:
        description: Catalog scales to measure
        default: '1,10,100'
      threshold:
        description: Bytes of growth tolerated before failing
        default: '512'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Transfer size vs base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # to post the comparison as a comment
    env:
      SCALES: ${{ inputs.scales || '1,10,100' }}
      THRESHOLD: ${{ inputs.threshold || '512' }}
      TARGETS: baseline,next-dialect
    steps:
      - name: Check out this PR
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base it will merge into
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The harness drives a real browser and reads transfer sizes off CDP.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Each benchmark target installs its own dependencies on first run, but
      # both need next-dialect's own deps present to build against it.
      - name: Install workspace dependencies
        run: |
          npm ci --prefix head
          npm ci --prefix base

      - name: Measure this PR
        working-directory: head
        run: >
          node benchmarks/harness/run-scales.mjs
          --scales "$SCALES" --only "$TARGETS" --out benchmarks/harness/ci

      - name: Measure the base
        working-directory: base
        run: >
          node benchmarks/harness/run-scales.mjs
          --scales "$SCALES" --only "$TARGETS" --out benchmarks/harness/ci

      - name: Compare
        id: compare
        run: >
          node head/benchmarks/harness/compare.mjs
          --base base/benchmarks/harness/ci
          --head head/benchmarks/harness/ci
          --scales "$SCALES" --threshold "$THRESHOLD"
          --markdown "$GITHUB_WORKSPACE/bench-comment.md"
        continue-on-error: true

      - name: Publish the numbers
        if: always()
        run: cat "$GITHUB_WORKSPACE/bench-comment.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- next-dialect-benchmark -->'
            let body = marker + '\n'
            try {
              body += fs.readFileSync(process.env.GITHUB_WORKSPACE + '/bench-comment.md', 'utf8')
            } catch {
              body += '### Benchmark\n\nThe run did not produce a comparison — see the job log.'
            }
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            // Update the existing comment rather than adding one per push.
            const comments = await github.rest.issues.listComments({owner, repo, issue_number})
            const mine = comments.data.find((c) => c.body.startsWith(marker))
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            head/benchmarks/harness/ci/
            base/benchmarks/harness/ci/
          retention-days: 14

      # The comment is posted first, so a regression still reports its numbers.
      - name: Fail on a regression
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::a transfer size grew by more than $THRESHOLD bytes — see the comparison above"
          exit 1
