name: Deploy website

# next-dialect.com is a Next static export served by an assets-only Cloudflare
# Worker (website/wrangler.jsonc). out/ is gitignored, so every deploy builds
# from source rather than shipping whatever happened to be on disk.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with Workers Scripts: Edit on the account,
#                            plus Zone: Read + Workers Routes: Edit on
#                            next-dialect.com for the custom domain.
#   CLOUDFLARE_ACCOUNT_ID  — the Veld Technologies account id.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://next-dialect.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run website:build

      # Uses the wrangler pinned in the lockfile rather than a separate action,
      # so a deploy from CI is the same command as a deploy from a laptop.
      - name: Deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
